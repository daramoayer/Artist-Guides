:root{
  --beige:#efe8d8;
  --paper:#faf6ea;
  --ink:#2f3a28;
  --ink-soft:#e3dbc4;
  --green:#8fb35a;
  --green-deep:#4d6b34;
  --green-dim:#6b8a49;
  --coral:#c9694f;
  --coral-deep:#a3402a;
  --muted:#8c8567;
  --line:rgba(77,107,52,0.15);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--beige);
  color:var(--paper);
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:48px 20px;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

.stage{width:100%; max-width:640px;}

.masthead{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:28px; border-bottom:1px solid var(--line); padding-bottom:18px;
}
.masthead .mark{font-family:'Maax Unicase',sans-serif; font-size:15px; font-weight:700; letter-spacing:0.02em; color:var(--ink);}
.masthead .mark span{color:var(--green-deep);}
.masthead .tag{font-family:'Nunito',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink); opacity:0.55;}

.meter{display:flex; gap:4px; margin-bottom:36px; height:6px;}
.meter .seg{flex:1; background:var(--ink-soft); border-radius:2px; overflow:hidden; position:relative;}
.meter .seg::after{content:''; position:absolute; inset:0; background:var(--green); transform:scaleX(0); transform-origin:left; transition:transform 0.5s cubic-bezier(.4,0,.2,1);}
.meter .seg.filled::after{transform:scaleX(1);}
.meter .seg.current::after{background:var(--green-deep);}

.panel{
  background:var(--paper); color:var(--ink); border-radius:6px; padding:40px 36px;
  min-height:340px; display:flex; flex-direction:column;
  animation:rise 0.4s cubic-bezier(.16,1,.3,1);
}
@keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{font-family:'Nunito',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--green-deep); margin-bottom:10px;}
h1{font-family:'Maax Unicase',sans-serif; font-size:25px; font-weight:700; line-height:1.28; margin:0 0 14px 0; letter-spacing:0.01em;}
p.lede{font-size:15.5px; line-height:1.6; color:#5c6650; margin:0 0 20px 0;}

.warning{
  display:flex; gap:12px; align-items:flex-start;
  background:rgba(201,105,79,0.12); border:1.5px solid rgba(201,105,79,0.35);
  border-radius:6px; padding:16px 18px; margin-bottom:22px;
}
.warning svg{flex-shrink:0; margin-top:2px;}
.warning strong{display:block; font-size:14.5px; color:var(--coral-deep); margin-bottom:4px;}
.warning p{margin:0; font-size:13.5px; line-height:1.55; color:#6b4536;}

.note{
  background:rgba(143,179,90,0.1); border-left:2.5px solid var(--green);
  border-radius:0 5px 5px 0; padding:12px 16px; margin-bottom:22px;
  font-size:13.5px; line-height:1.55; color:var(--green-deep);
}
.note strong{color:var(--ink);}

.field{margin-bottom:18px;}
.field label{display:block; font-family:'Nunito',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--green-deep); margin-bottom:8px;}
.copy-row{display:flex; gap:8px;}
.copy-row .val{
  flex:1; border:1.5px solid #ddd3b3; border-radius:5px; padding:11px 13px;
  font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; color:var(--ink); background:#fff;
}
.copy-btn{
  border:1.5px solid #ddd3b3; background:#fff; border-radius:5px; padding:0 16px;
  font-family:'Nunito',sans-serif; font-weight:700; font-size:13px; color:var(--green-deep); cursor:pointer;
}
.copy-btn:hover{border-color:var(--green);}
.copy-btn.copied{color:var(--paper); background:var(--green-deep); border-color:var(--green-deep);}

.step-track{font-family:'Nunito',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.03em; color:var(--muted); margin-bottom:6px;}
.step-body{flex:1; font-size:16px; line-height:1.6; margin-bottom:20px;}
.step-instruction{
  font-family:'Nunito',sans-serif;
  font-size:19px;
  font-weight:700;
  line-height:1.5;
  color:var(--ink);
  margin:0 0 12px 0;
}
.step-instruction strong{color:var(--green-deep);}
.step-instruction a{color:var(--green-deep); text-decoration:underline; text-decoration-color:rgba(77,107,52,0.4);}
.step-instruction a:hover{color:var(--ink);}
.step-body .hint{margin-top:14px; font-size:13.5px; color:var(--green-deep); background:rgba(143,179,90,0.12); border-left:2.5px solid var(--green); padding:10px 14px; border-radius:0 4px 4px 0;}

.shot{
  width:100%; border-radius:6px; border:1px solid #e3dcc2; margin-top:16px;
  box-shadow:0 4px 16px rgba(47,58,40,0.08); display:block;
}

.nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:20px; border-top:1px solid #e3dcc2;}
.btn{font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; padding:11px 22px; border-radius:5px; border:none; cursor:pointer; transition:opacity 0.15s;}
.btn:hover{opacity:0.85;}
.btn-primary{background:var(--green-deep); color:var(--paper);}
.btn-secondary{background:transparent; color:var(--ink); border:1.5px solid #ddd3b3;}

.recap-list{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
.recap-item{display:flex; gap:10px; align-items:flex-start; font-size:14.5px; line-height:1.5; font-weight:600;}
.recap-item svg{flex-shrink:0; margin-top:2px;}

.footer-note{text-align:center; margin-top:22px; font-size:12.5px; font-weight:600; color:var(--ink); opacity:0.5; font-family:'Nunito',sans-serif;}
</style>
</head>

  <div class="masthead">
    <div class="mark">duetti <span>·</span> spotify access setup</div>
    <div class="tag" id="stageLabel">start</div>

  <div class="meter" id="meter"></div>
  <div class="panel" id="panel"></div>

const TOTAL_STEPS = 5;
let state = { screen: "intro", stepIndex: 0, copied: false };

const panel = document.getElementById('panel');
const meter = document.getElementById('meter');
const stageLabel = document.getElementById('stageLabel');

function renderMeter(activeIdx){
  meter.innerHTML = "";
  for(let i=0;i<TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg';
    if(i < activeIdx) seg.className += ' filled';
    else if(i === activeIdx) seg.className += ' current';
    meter.appendChild(seg);
  }
}

function go(screen, stepIndex){
  state.screen = screen;
  if(stepIndex !== undefined) state.stepIndex = stepIndex;
  render();
}

function render(){
  if(state.screen === "intro"){ renderMeter(0); stageLabel.textContent = "why this matters"; return renderIntro(); }
  if(state.screen === "steps"){ renderMeter(state.stepIndex+1); stageLabel.textContent = `step ${state.stepIndex+1} of ${STEPS.length}`; return renderStep(); }
  if(state.screen === "recap"){ renderMeter(TOTAL_STEPS); stageLabel.textContent = "done"; return renderRecap(); }
}

function renderIntro(){
  panel.innerHTML = `
    <div class="eyebrow">Before your release can be pitched</div>
    <h1>Give Duetti admin access on Spotify for Artists</h1>
    <div class="warning">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L18.5 17H1.5L10 2Z" stroke="#a3402a" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8V11.5" stroke="#a3402a" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14" r="0.9" fill="#a3402a"/></svg>
      <div>
        <strong>This step is required.</strong>
        <p>Without admin access, your release can't be pitched to Spotify editorial.</p>
      </div>
    </div>
    <div class="note"><strong>Buying ads via Marquee or Showcase?</strong> Admin access is required for that too — not just editor or reader level.</div>
    <p class="lede">This will take about two minutes. We'll walk through it one step at a time.</p>
    <div class="nav-row" style="border-top:none; padding-top:0;">
      <div></div>
      <button class="btn btn-primary" onclick="go('steps', 0)">Get started →</button>
    </div>
  `;
}

const STEPS = [
  {
    body: "Go to <strong>Spotify for Artists</strong> and use the dropdown in the top right corner to select <strong>Teams</strong> — or go directly to <a href=\"https://manage.spotify.com/teams\" target=\"_blank\" rel=\"noopener\">manage.spotify.com/teams</a>.",
    hint: "This is Spotify's team management dashboard — separate from the regular Spotify for Artists app.",
    img: null
  },
  {
    body: "Select the correct <strong>artist or label team</strong> from the top of the page.",
    hint: "If you manage more than one artist, double check you're on the right one before inviting anyone.",
    img: null
  },
  {
    body: "Click <strong>Invite</strong> in the top right of the Team members page.",
    img: "team"
  },
  {
    body: "Enter <strong>sfa@duetti.co</strong> as the email, and <strong>Duetti</strong> as the title. Leave \"Set team member as team admin\" off — access is granted at the app level in the next step.",
    img: "invite",
    copyEmail: true
  },
  {
    body: "Under <strong>Spotify for Artists</strong>, set the access level dropdown to <strong>Admin</strong> — not Editor or Reader — then click <strong>Send Invite</strong>.",
    img: "access",
    hint: "Admin is what allows Duetti to manage pitches, campaigns, and billing info on your behalf."
  }
];

function renderStep(){
  const i = state.stepIndex;
  const s = STEPS[i];
  const imgHtml = s.img ? `<img class="shot" src="${IMG[s.img]}" alt="Spotify for Artists screenshot" />` : '';
  const hintHtml = s.hint ? `<div class="hint">${s.hint}</div>` : '';
  const copyHtml = s.copyEmail ? `
    <div class="field" style="margin-top:16px;">
      <label>Email to enter</label>
      <div class="copy-row">
        <div class="val">sfa@duetti.co</div>
        <button class="copy-btn" id="copyBtn" onclick="copyEmail()">Copy</button>
      </div>
    </div>` : '';

  panel.innerHTML = `
    <div class="eyebrow">Setting up Duetti's access</div>
    <div class="step-track">Step ${i+1} of ${STEPS.length}</div>
    <div class="step-body">
      <div class="step-instruction">${s.body}</div>
      ${copyHtml}
      ${hintHtml}
      ${imgHtml}
    </div>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="stepBack()">← Back</button>
      <button class="btn btn-primary" onclick="stepNext()">${i === STEPS.length-1 ? "I've sent the invite →" : "Next step →"}</button>
    </div>
  `;
}

function copyEmail(){
  navigator.clipboard.writeText('sfa@duetti.co').then(()=>{
    const btn = document.getElementById('copyBtn');
    if(btn){ btn.textContent = 'Copied'; btn.classList.add('copied'); setTimeout(()=>{ if(btn){btn.textContent='Copy'; btn.classList.remove('copied');} }, 1500); }
  });
}

function stepBack(){
  if(state.stepIndex > 0){ state.stepIndex -= 1; render(); }
  else { go('intro'); }
}
function stepNext(){
  if(state.stepIndex < STEPS.length - 1){ state.stepIndex += 1; render(); }
  else { go('recap'); }
}

function renderRecap(){
  panel.innerHTML = `
    <div class="eyebrow">All set</div>
    <h1>Double-check before you're done:</h1>
    <div class="recap-list">
      ${recapItem("The invite was sent to sfa@duetti.co with the title \"Duetti.\"")}
      ${recapItem("Spotify for Artists access is set to Admin — not Editor or Reader.")}
      ${recapItem("You're on the correct artist or label team if you manage more than one.")}
    </div>
    <p class="lede" style="margin-bottom:0;">Once Duetti accepts the invite, you'll see it reflected on your Team members list. If it doesn't show up within a day or two, just check in with your Duetti contact.</p>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="go('steps', ${STEPS.length-1})">← Back to steps</button>
      <button class="btn btn-primary" onclick="go('intro')">Start over</button>
    </div>
  `;
}

function recapItem(text){
  return `<div class="recap-item">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.25" stroke="#4d6b34" stroke-width="1.5"/><path d="M4.5 8.2L6.8 10.5L11.5 5.5" stroke="#4d6b34" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>${text}</span>
  </div>`;
}

render();
</script>
</body>
</html>
